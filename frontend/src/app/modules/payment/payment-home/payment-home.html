<div class="stack">
  <h1>Payment</h1>

  @if (error()) {
    <p class="notice notice--danger" role="alert">{{ error() }}</p>
  }

  <p>
    @if (isAdministrator()) {
      <a class="button button--primary" routerLink="/payment/wallets">Novčanici</a>
    } @else {
      <button
        class="button button--primary"
        type="button"
        [disabled]="pending()"
        (click)="openWallet()"
      >
        Moj novčanik
      </button>
    }
  </p>

  <p><a routerLink="/payment/catalog">Ponuda</a></p>

  @if (isExplorer()) {
    <p><a routerLink="/payment/coupons">Coupons</a></p>
    <p><a routerLink="/payment/coupons/new">Create coupon</a></p>
    <p><a routerLink="/payment/cart">Korpa</a></p>
    <p><a routerLink="/payment/purchases">Kupljene ture</a></p>
  }
</div>
