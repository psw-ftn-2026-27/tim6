<div class="stack">
  <p><a routerLink="/social">Back</a></p>

  <h1>All clubs</h1>

  @if (clubs.isLoading()) {
    <p>Loading clubs...</p>
  } @else if (clubs.error()) {
    <p class="error">Could not load clubs. Log in and try again.</p>
  } @else {
    @for (club of clubs.value()?.items ?? []; track club.id) {
      <app-club-card [club]="club" />
    } @empty {
      <p>No clubs yet.</p>
    }
  }
</div>
