@switch (state()) {
  @case ('Follow') {
    <button
      class="button button--primary"
      type="button"
      [disabled]="pending()"
      (click)="follow.emit()"
    >
      Follow
    </button>
  }
  @case ('Pending') {
    <button class="button" type="button" disabled>Request sent</button>
  }
  @case ('Following') {
    <button class="button" type="button" disabled>Following</button>
  }
}
