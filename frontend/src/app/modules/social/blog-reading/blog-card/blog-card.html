<article class="card stack">
  <h3>{{ blog().title }}</h3>

  <p>{{ preview() }}</p>

  <p class="meta">
    Status:
    <span class="badge" [class.badge--success]="blog().status === 'Published'">{{
      blog().status
    }}</span>
  </p>

  <p class="meta">Comments: {{ blog().comments.length }}</p>

  <p class="meta">Score: {{ blog().score }}</p>

  <a [routerLink]="['/social', blog().id]">Read more</a>
</article>
